<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>המאמן האישי</title>
    
    <!-- הגדרות להתאמה מלאה לאייפון (iOS PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="אימון ותזונה">
    
    <!-- אייקון האפליקציה למסך הבית באייפון -->
    <link rel="apple-touch-icon" href=“icon.png?v=2">
    
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #10b981;
            --streak-color: #f59e0b;
            --text-color: #1f2937;
            --subtext: #4b5563;
            --work-color: #ef4444;
            --rest-color: #10b981;
        }

        * {
            box-sizing: border-box !important;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            -webkit-user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            min-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3 { text-align: center; margin-top: 0; }

        .streak-banner {
            background: #fffbe3;
            border: 2px solid var(--streak-color);
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: #b45309;
        }

        .streak-count { font-size: 22px; color: var(--streak-color); }

        .reminder-alert {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .level-selector-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s;
            display: block;
            text-align: center;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #6b7280; }
        .btn-accent { background-color: var(--accent); width: 100%; padding: 14px 20px; font-size: 16px; }
        .hidden { display: none !important; }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        /* תיקון מקיף לשדות קלט ב-iOS Safari */
        input[type="time"], select {
            width: 100% !important;
            max-width: 100% !important;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 18px;
            margin: 0 0 12px 0;
            text-align: center;
            display: block;
            background-color: #f9fafb;
            color: var(--text-color);
            -webkit-appearance: none;
            appearance: none;
            direction: ltr; /* יישור מספרים ומציג שעה תקינה */
        }

        .card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .exercise-info { max-width: 70%; }
        .exercise-title { font-weight: bold; display: block; }
        .exercise-sub { font-size: 13px; color: var(--subtext); }

        .timer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .timer-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 340px;
        }

        .timer-display { font-size: 56px; font-weight: bold; margin: 15px 0; }
        .timer-display.work { color: var(--work-color); }
        .timer-display.rest { color: var(--rest-color); }
        .set-counter { font-size: 18px; font-weight: bold; color: var(--subtext); margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Streak Display -->
    <div class="streak-banner">
        <span>🔥 רצף יומיומי (Streak):</span>
        <span id="streak-display" class="streak-count">0 ימים</span>
    </div>

    <!-- באנר תזכורת חירום לחיץ לסגירה -->
    <div id="reminder-alert-box" class="reminder-alert hidden" onclick="dismissReminder()">
        <span id="reminder-alert-text">🔔 תזכורת: השעה שהגדרת הגיעה! זמן לביצוע האימון היומי 🔥</span>
        <div style="font-size: 12px; font-weight: normal; margin-top: 4px; text-decoration: underline;">(לחץ כאן לסגירה)</div>
    </div>

    <!-- מסך ראשי -->
    <div id="home-screen">
        <h1>המאמן האישי שלי 🏋️‍♂️</h1>
        <p style="text-align: center; color: var(--subtext);">בחר מה ברצונך לבדוק עכשיו:</p>
        <div class="menu-options">
            <button class="btn" onclick="showScreen('meal-screen')">🍎 תפריט תזונה מורחב</button>
            <button class="btn" onclick="showScreen('workout-screen')">💪 אימון יומי</button>
            <button class="btn btn-secondary" onclick="showScreen('notif-screen')">🔔 הגדרת התראה יומית</button>
        </div>
    </div>

    <!-- מסך תפריט -->
    <div id="meal-screen" class="hidden">
        <h2>תפריט תזונה 🥗</h2>
        <label for="time-input" style="display:block; text-align:center; margin-bottom:8px;">מה השעה עכשיו? (פורמט 24 שעות):</label>
        <input type="time" id="time-input" value="14:00">
        <button class="btn" onclick="calculateMeal()">הצג אופציות לארוחה זו</button>

        <div id="meal-result" class="card hidden"></div>
        <button class="btn btn-secondary" onclick="showScreen('home-screen')">חזרה למסך הראשי</button>
    </div>

    <!-- מסך אימון -->
    <div id="workout-screen" class="hidden">
        <h2>אימון יומי 🏋️</h2>

        <div class="level-selector-box">
            <label for="workout-level-select" style="font-weight: bold; display: block; margin-bottom: 6px;">🎯 דרגת קושי לאימון:</label>
            <select id="workout-level-select" onchange="changeFitnessLevel(this.value)">
                <option value="level1" selected>🟢 דרגה 1: האימון המקורי (התחלה)</option>
                <option value="level2">🌱 דרגה 2: שלב 2 (עומס מוגבר קל)</option>
                <option value="level3">🟡 דרגה 3: שלב 3 (קצב בינוני-גבוה)</option>
                <option value="level4">🟠 דרגה 4: שלב 4 (אינטנסיבי)</option>
                <option value="level5">🔴 דרגה 5: שלב 5 (מתקדם ביותר)</option>
            </select>
        </div>

        <label for="day-select" style="display:block; text-align:center; margin-bottom:6px;">איזה יום היום?</label>
        <select id="day-select" onchange="loadWorkout()">
            <option value="1">יום ראשון</option>
            <option value="2">יום שני</option>
            <option value="3">יום שלישי</option>
            <option value="4">יום רביעי</option>
            <option value="5">יום חמישי</option>
            <option value="6">יום שישי</option>
            <option value="7">יום שבת</option>
        </select>

        <div id="workout-list"></div>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="showScreen('home-screen')">חזרה למסך הראשי</button>
    </div>

    <!-- מסך התראות -->
    <div id="notif-screen" class="hidden">
        <h2>התראה יומית 🔔</h2>
        <p style="text-align: center; color: var(--subtext);">בחר באיזו שעה תרצה לקבל תזכורת להתאמן ולשמור על ה-Streak:</p>
        <input type="time" id="notif-time" value="16:00">
        <button class="btn" onclick="setDailyReminder()">שמור התראה</button>
        <button class="btn btn-accent" onclick="testNotification()">בדוק התראה עכשיו 🔔</button>
        <div id="notif-status" style="text-align: center; margin-top: 10px; font-weight: bold; color: var(--accent);"></div>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="showScreen('home-screen')">חזרה למסך הראשי</button>
    </div>
</div>

<!-- חלון טיימר -->
<div id="timer-modal" class="timer-modal hidden">
    <div class="timer-content">
        <h3 id="timer-title">תרגיל</h3>
        <div id="set-counter" class="set-counter">סט 1</div>
        <div id="timer-status" style="font-weight: bold; font-size: 20px;">התארגן...</div>
        <div id="timer-display" class="timer-display work">00:30</div>
        <button class="btn btn-secondary" onclick="closeTimer()">סגור / בטל</button>
    </div>
</div>

<script>
    // --- STREAK MANAGEMENT ---
    function checkAndUpdateStreak() {
        const lastActive = localStorage.getItem('last_active_date');
        let streak = parseInt(localStorage.getItem('user_streak') || '0', 10);

        if (lastActive) {
            const lastDate = new Date(lastActive);
            const today = new Date();
            const diffDays = Math.ceil(Math.abs(today - lastDate) / (1000 * 60 * 60 * 24));

            if (diffDays > 2) {
                streak = 0;
                localStorage.setItem('user_streak', '0');
            }
        }
        document.getElementById('streak-display').innerText = `${streak} ימים`;
    }

    function incrementStreak() {
        const todayStr = new Date().toDateString();
        const lastActive = localStorage.getItem('last_active_date');

        if (lastActive !== todayStr) {
            let streak = parseInt(localStorage.getItem('user_streak') || '0', 10) + 1;
            localStorage.setItem('user_streak', streak.toString());
            localStorage.setItem('last_active_date', todayStr);
            document.getElementById('streak-display').innerText = `${streak} ימים`;
            alert(`🔥 כל הכבוד! הגדלת את ה-Streak שלך ל-${streak} ימים!`);
        }
    }

    // --- FITNESS LEVEL MANAGEMENT ---
    let currentLevel = localStorage.getItem('fitness_level') || 'level1';

    function initLevelSelector() {
        document.getElementById('workout-level-select').value = currentLevel;
    }

    function changeFitnessLevel(newLevel) {
        currentLevel = newLevel;
        localStorage.setItem('fitness_level', newLevel);
        loadWorkout();
    }

    // --- REMINDERS & NOTIFICATIONS ---
    let isTestingNotif = false; // מדד שמבדיל בין בדיקה להתראה אמיתית

    function dismissReminder() {
        document.getElementById('reminder-alert-box').classList.add('hidden');
        // נרשום שהתראה אמיתית טופלה להיום רק אם זו לא היתה בדיקה בלבד
        if (!isTestingNotif) {
            localStorage.setItem('last_notif_sent', new Date().toDateString());
        }
        isTestingNotif = false;
    }

    function setDailyReminder() {
        const time = document.getElementById('notif-time').value;
        localStorage.setItem('reminder_time', time);

        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notif-status').innerText = `✓ התראה הוגדרה לשעה ${time}`;
                } else {
                    document.getElementById('notif-status').innerText = `✓ תזכורת הוגדרה לשעה ${time} (תוך-אפליקציה)`;
                }
            });
        } else {
            document.getElementById('notif-status').innerText = `✓ תזכורת הוגדרה לשעה ${time}`;
        }
    }

    function testNotification() {
        playBeep(880, 0.6);
        isTestingNotif = true; // מסמן שזאת רק בדיקה ולא התראת אמת
        
        document.getElementById('reminder-alert-text').innerText = "🧪 בדיקת התראה: המערכת עובדת מצוין!";
        document.getElementById('reminder-alert-box').classList.remove('hidden');

        if ("Notification" in window && Notification.permission === "granted") {
            new Notification("המאמן האישי 🏋️‍♂️", { body: "בדיקת התראה עובדת מצוין!" });
        }
    }

    function scheduleNotificationCheck() {
        setInterval(() => {
            const savedTime = localStorage.getItem('reminder_time');
            if (!savedTime) return;

            const now = new Date();
            const currentTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const lastNotif = localStorage.getItem('last_notif_sent');

            // התראת אמת: מופיעה בשעה שהוגדרה, אם עדיין לא הופיעה היום
            if (currentTime === savedTime && lastNotif !== now.toDateString()) {
                isTestingNotif = false;
                playBeep(880, 0.8);
                document.getElementById('reminder-alert-text').innerText = "🔔 תזכורת: השעה שהגדרת הגיעה! זמן לביצוע האימון היומי 🔥";
                document.getElementById('reminder-alert-box').classList.remove('hidden');
                localStorage.setItem('last_notif_sent', now.toDateString());

                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("המאמן האישי 🏋️‍♂️", {
                        body: "זמן להתאמן! היכנס כדי לשמור על ה-Streak שלך 🔥"
                    });
                }
            }
        }, 15000);
    }

    // --- MEAL DATA ---
    function getMealByTime(timeStr) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        const totalMinutes = hours * 60 + minutes;

        if (totalMinutes >= 360 && totalMinutes < 600) {
            return {
                title: "🌅 ארוחת בוקר (לפני בית ספר)",
                content: "• <b>אופציה 1:</b> יוגורט חלבון + בננה/תפוח + חופן אגוזים.<br>• <b>אופציה 2:</b> כוס חלב/משקה סויה + 4 כפות שיבולת שועל.<br>• <b>אופציה 3:</b> 2 פריכיות עם גבינה צהובה 9% / לבנה 5% + ירק.<br>• <b>אופציה 4:</b> שייק: חלב, בננה, כפית חמאת בוטנים ושיבולת שועל."
            };
        } else if (totalMinutes >= 600 && totalMinutes < 780) {
            return {
                title: "🏫 ארוחת עשר (בית ספר)",
                content: "<b>בחר 2 כריכים מלחם מלא:</b><br>• <b>כריך טונה:</b> טונה, מעט מיונז קל/חומוס + מלפפון.<br>• <b>כריך חביתה:</b> חביתה מ-2 ביצים + עגבנייה.<br>• <b>כריך גבינה:</b> צהובה 9% / צפתית / בולגרית + ירק.<br>• <b>כריך טופו:</b> אופציה צמחונית עשירה בחלבון.<br><i>תוספת: פרי (תפוח/אגס/קלמנטינה) או חופן שקדים.</i>"
            };
        } else if (totalMinutes >= 780 && totalMinutes < 960) {
            return {
                title: "🍽️ ארוחת צהריים (חזרה מבית ספר)",
                content: "• <b>חלבון:</b> חזה עוף / שניצל בתנור / קציצות / דג / טופו.<br>• <b>פחמימה:</b> כוס וחצי אורז / פתיתים / פסטה מלאה / בטטה / כוסמת.<br>• <b>ירק:</b> סלט טרי, ירקות מבושלים (שעועית ירוקה/ברוקולי) או בתנור."
            };
        } else if (totalMinutes >= 960 && totalMinutes < 1140) {
            return {
                title: "⚡ ארוחת אחר הצהריים (לפני אימון)",
                content: "• <b>אופציה 1:</b> לחם מלא עם כפית חמאת בוטנים ובננה.<br>• <b>אופציה 2:</b> מעדן חלבון + תפוח.<br>• <b>אופציה 3:</b> 2-3 תמרים + 5 שקדים טבעיים.<br>• <b>אופציה 4:</b> חטיף דגנים/חלבון."
            };
        } else if (totalMinutes >= 1140 && totalMinutes < 1320) {
            return {
                title: "🌙 ארוחת ערב (לאחר אימון)",
                content: "• <b>אופציה 1:</b> שקשוקה/חביתה מ-2 ביצים + 3 כפות קוטג' 5% + 2 פרוסות לחם מלא + סלט.<br>• <b>אופציה 2:</b> טוסט גבינה צהובה 9% וטונה + ירקות.<br>• <b>אופציה 3:</b> שקשוקת טופו / גבינה לבנה + פיתה כוסמין.<br>• <b>אופציה 4:</b> סלט יווני עם בולגרית 5%, ביצה קשה, זיתים ולחם."
            };
        } else {
            return {
                title: "💤 ארוחת לילה",
                content: "• קוטג' / גבינה לבנה 5% + מלפפון.<br>• כוס חלב חם / משקה חלבון קל.<br><i>הקפד על 8-9 שעות שינה לבניית השריר!</i>"
            };
        }
    }

    // --- WORKOUT DATA ---
    const rawWorkouts = {
        1: { title: "כוח + הליכון קצר", exercises: [
            { name: "שכיבות סמיכה", 
              level1: { sets: 3, work: 35, rest: 60, reps: "8-12 חזרות" }, 
              level2: { sets: 3, work: 40, rest: 50, reps: "10-14 חזרות" }, 
              level3: { sets: 3, work: 45, rest: 45, reps: "12-15 חזרות" }, 
              level4: { sets: 4, work: 50, rest: 40, reps: "15-18 חזרות" }, 
              level5: { sets: 4, work: 60, rest: 30, reps: "20+ חזרות" } 
            },
            { name: "סקוואטים", 
              level1: { sets: 3, work: 40, rest: 60, reps: "12-15 חזרות" }, 
              level2: { sets: 3, work: 45, rest: 50, reps: "15-18 חזרות" }, 
              level3: { sets: 3, work: 50, rest: 45, reps: "18-20 חזרות" }, 
              level4: { sets: 4, work: 55, rest: 40, reps: "22-25 חזרות" }, 
              level5: { sets: 4, work: 60, rest: 30, reps: "25+ חזרות" } 
            },
            { name: "לאנג'ים", 
              level1: { sets: 3, work: 45, rest: 60, reps: "10 חזרות לכל רגל" }, 
              level2: { sets: 3, work: 50, rest: 50, reps: "12 חזרות לכל רגל" }, 
              level3: { sets: 3, work: 55, rest: 45, reps: "14 חזרות לכל רגל" }, 
              level4: { sets: 4, work: 60, rest: 40, reps: "16 חזרות לכל רגל" }, 
              level5: { sets: 4, work: 65, rest: 30, reps: "20 חזרות לכל רגל" } 
            },
            { name: "פלאנק", 
              level1: { sets: 3, work: 40, rest: 45, reps: "30-45 שניות" }, 
              level2: { sets: 3, work: 50, rest: 45, reps: "50 שניות" }, 
              level3: { sets: 3, work: 60, rest: 40, reps: "60 שניות" }, 
              level4: { sets: 4, work: 75, rest: 35, reps: "75 שניות" }, 
              level5: { sets: 4, work: 90, rest: 30, reps: "90 שניות" } 
            },
            { name: "כפיפות בטן", 
              level1: { sets: 3, work: 35, rest: 45, reps: "12-15 חזרות" },

    // UI ROUTING
    function showScreen(screenId) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('meal-screen').classList.add('hidden');
        document.getElementById('workout-screen').classList.add('hidden');
        document.getElementById('notif-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');

        if(screenId === 'workout-screen') loadWorkout();
    }

    function calculateMeal() {
        const timeValue = document.getElementById('time-input').value;
        if (!timeValue) return;
        const meal = getMealByTime(timeValue);
        const resultDiv = document.getElementById('meal-result');
        resultDiv.innerHTML = `<h3>${meal.title}</h3><p>${meal.content}</p>`;
        resultDiv.classList.remove('hidden');
    }

    function loadWorkout() {
        const day = document.getElementById('day-select').value;
        const data = rawWorkouts[day];
        const container = document.getElementById('workout-list');
        
        let html = `<h3 style="margin-top:15px;">${data.title}</h3>`;
        data.exercises.forEach((ex, idx) => {
            if (ex.isRestDay) {
                html += `
                    <div class="exercise-item">
                        <div class="exercise-info">
                            <span class="exercise-title">${ex.name}</span>
                            <span class="exercise-sub">ה-Streak שלך נשמר אוטומטית!</span>
                        </div>
                    </div>
                `;
            } else {
                const lvlData = ex[currentLevel];
                html += `
                    <div class="exercise-item">
                        <div class="exercise-info">
                            <span class="exercise-title">${ex.name}</span>
                            <span class="exercise-sub">${lvlData.sets} סטים x ${lvlData.reps}</span>
                        </div>
                        <button class="btn btn-accent" style="width:auto; padding: 8px 16px; font-size:14px;" onclick="startWorkoutRoutine(${day}, ${idx})">התחל</button>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
    }

    // TIMER ENGINE
    let timerInterval = null;
    let currentSet = 1;
    let totalSets = 3;
    let workSec = 30;
    let restSec = 60;

    function startWorkoutRoutine(day, exIndex) {
        dismissReminder();
        const rawEx = rawWorkouts[day].exercises[exIndex];
        const lvlData = rawEx[currentLevel];

        currentSet = 1;
        totalSets = lvlData.sets;
        workSec = lvlData.work;
        restSec = lvlData.rest;

        document.getElementById('timer-modal').classList.remove('hidden');
        document.getElementById('timer-title').innerText = rawEx.name;
        startPrepPhase();
    }

    function startPrepPhase() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('set-counter').innerText = `סט ${currentSet} מתוך ${totalSets}`;
        document.getElementById('timer-status').innerText = "התכונן למאמץ! 🔥";
        document.getElementById('timer-display').className = "timer-display work";
        
        let prepLeft = 3;
        updateTimerDisplay(prepLeft);

        timerInterval = setInterval(() => {
            prepLeft--;
            updateTimerDisplay(prepLeft);
            if (prepLeft <= 0) {
                clearInterval(timerInterval);
                playBeep(880, 0.4);
                startWorkPhase();
            }
        }, 1000);
    }

    function startWorkPhase() {
        document.getElementById('timer-status').innerText = "בצע את הסט עכשיו! 💪";
        document.getElementById('timer-display').className = "timer-display work";

        let timeLeft = workSec;
        updateTimerDisplay(timeLeft);

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                playBeep(440, 0.5);

                if (currentSet < totalSets && restSec > 0) {
                    startRestPhase();
                } else {
                    finishExercise();
                }
            }
        }, 1000);
    }

    function startRestPhase() {
        document.getElementById('timer-status').innerText = "זמן מנוחה ☕";
        document.getElementById('timer-display').className = "timer-display rest";

        let timeLeft = restSec;
        updateTimerDisplay(timeLeft);

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                currentSet++;
                playBeep(660, 0.4);
                startPrepPhase();
            }
        }, 1000);
    }

    function finishExercise() {
        document.getElementById('timer-status').innerText = "כל הכבוד! סיימת את התרגיל 🎉";
        document.getElementById('timer-display').innerText = "✓";
        document.getElementById('timer-display').className = "timer-display rest";
        playBeep(880, 0.8);
        incrementStreak();
    }

    function updateTimerDisplay(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    function closeTimer() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('timer-modal').classList.add('hidden');
    }

    // פונקציית צליל
    function playBeep(freq = 600, duration = 0.5) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // INIT
    initLevelSelector();
    checkAndUpdateStreak();
    scheduleNotificationCheck();
